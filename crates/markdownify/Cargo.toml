[package]
name = "markdownify"
version = "0.3.8"
description = "markitdown in rust - convert various document and files into markdown"
keywords = ["conversion", "document", "markdown", "markitdown", "parser"]
categories = ["parser-implementations", "text-processing"]
repository = "https://github.com/Skardyy/mcat"
homepage = "https://github.com/Skardyy/mcat"
documentation = "https://github.com/Skardyy/mcat"
license = "MIT"
readme = "README.md"
edition = "2024"
exclude = ["fixtures/"]

[dependencies]
thiserror.workspace = true

tar.workspace = true
zip.workspace = true

flate2.workspace = true
lzma-rust2.workspace = true

calamine.workspace = true
csv.workspace = true

quick-xml.workspace = true

base64.workspace = true
encoding_rs.workspace = true
infer.workspace = true
