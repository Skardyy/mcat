[workspace]
resolver = "3"
members = ["crates/core", "crates/markdownify", "crates/rasteroid"]

[workspace.dependencies]
markdownify = { path = "crates/markdownify", version = "0.3.8" }
rasteroid = { path = "crates/rasteroid", version = "0.4.0" }

anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

tokio = { version = "1.53.1", default-features = false, features = ["macros"] }
tokio-tungstenite = "0.30.0"

base64 = "0.23.0"
boxcar = "0.2.14"
comrak = { version = "0.54.0", default-features = false, features = [
  "shortcodes",
  "syntect",
] }
crossterm = { version = "0.29.0", default-features = false, features = [
  "events",
  "windows",
] }
dirs = "6.0.0"
encoding_rs = "0.8.35"
ffmpeg-sidecar = { version = "2.5.2", default-features = false }
fontdb = "0.23.0"
futures = "0.3.33"
hayro = "0.7.1"
ignore = "0.4.31"
image = { version = "0.25.10", default-features = false }
indicatif = "0.18.6"
infer = "0.22.0"
inquire = "0.9.4"
itertools = "0.15.0"
jxl-oxide = { version = "0.12.6", features = ["image"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "stream",
] }
resvg = "0.47.0"
scraper = "0.27.0"
serde_json = "1.0.151"
shell-words = "1.1.1"
strip-ansi-escapes = "0.2.1"
syntect = "5.3.0"
tempfile = "3.27.0"
textwrap = "0.16.2"
two-face = "0.5.1"
unicode-width = "0.2.2"
which = "8.0.5"

calamine = "0.36.1"
csv = "1.4.0"
flate2 = "1.1.9"
lzma-rust2 = { version = "0.18.0", default-features = false, features = [
  "std",
  "xz",
] }
quick-xml = "0.41.0"
tar = "0.4.46"
thiserror = "2.0.19"
zip = { version = "8.6.0", default-features = false, features = [
  "deflate-flate2",
] }

color_quant = "2.0.0"
fast_image_resize = { version = "6.1.0", features = ["image"] }
libc = "0.2.189"
rand = "0.10.2"
shared_memory_fork = "0.12.5"
signal-hook = "0.4.4"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

assert_cmd = "2.2.2"
indoc = "2.0.7"
predicates = "3.1.4"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
